<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Run!</title>
    <link rel="shortcut icon" href="Imagens/pipe.png" type="image/x-icon">
    <link rel="stylesheet" href="Jogo_style.css">
    <script src="Jogo.js" defer></script>
    <style></style>
</head>
<body>
<div class="game-board">
    <img src="Imagens/clouds.png" class="clouds" alt="nuvem">
    <img src="Imagens/mario.gif" class="mario" alt="mario">
    <img src="Imagens/pipe.png" class="pipe" alt="pipe">
    <img src="Imagens/Mario_Coin.png" class="coin" alt="coin">

    <div class="start-menu" id="startMenu">
        <h1 class="game-title">MARIO RUN</h1>
        <p class="subtitle">Pressione qualquer tecla para jogar</p>
        <button id="playBtn">JOGAR</button>
        <p class="instructions">Espaço ou qualquer tecla para pular</p>
    </div>

    <div class="game-over" id="gameOver">
        <h2>GAME OVER</h2>
        <p>Score Final: <span id="finalScore">0</span></p>
        <button id="restartBtn">Reiniciar</button>
    </div>
</div>

<h1 class="score">Score: <span id="score">0</span></h1>
<script src="script.js"></script>

<audio controls autoplay
 src="sons/Overworld Theme - Super Mario World.mp3">
</audio>

    
</body>
</html>
